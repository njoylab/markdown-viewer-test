<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markdown Viewer</title>
    <link rel="icon" href="data:," />
    <script>
      try {
        var stored = localStorage.getItem("md-viewer-theme");
        var theme = stored === "light" || stored === "dark"
          ? stored
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (error) {}
    </script>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="toolbar" aria-label="Markdown upload">
        <div>
          <h1>Markdown Viewer</h1>
          <p>Load a local Markdown file and preview it as formatted HTML.</p>
          <p class="toolbar-hint">Drop a file anywhere, paste with Ctrl/Cmd+V, or upload below.</p>
          <p id="upload-error" class="upload-error" role="alert" hidden></p>
        </div>
        <div class="toolbar-actions">
          <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
          <label class="upload-button">
            <span>Upload .md</span>
            <input id="file-input" type="file" accept=".md,.markdown,text/markdown,text/plain" />
          </label>
        </div>
      </section>

      <section class="workspace">
        <article id="preview" class="preview" aria-live="polite">
          <h2>Ready to preview Markdown</h2>
          <p>Upload a .md or .markdown file to see formatted headings, lists, links and code blocks here.</p>
          <div class="examples" aria-label="Example Markdown documents">
            <h3>Try an example</h3>
            <div class="example-actions">
              <button type="button" data-example="release-notes">Release notes</button>
              <button type="button" data-example="project-plan">Project plan</button>
              <button type="button" data-example="technical-note">Technical note</button>
              <button type="button" data-example="frontmatter">Frontmatter</button>
            </div>
          </div>
        </article>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
