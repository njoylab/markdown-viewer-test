name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: node --test --test-concurrency=1 test/e2e/*.test.js

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - name: Fail if any asset is not hashed
        run: |
          if grep -rq '__ASSET_VERSION__' dist; then
            echo "dist still contains an unresolved asset placeholder"
            exit 1
          fi
          if find dist/src -type f | grep -vqE '\.[a-f0-9]{12}\.(js|css)$'; then
            echo "dist contains an unhashed asset"
            find dist/src -type f
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7